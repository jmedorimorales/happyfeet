<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Feet</title>
<meta name="theme-color" content="#2a7f9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Happy Feet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--accent:#2a7f9e;--ink:#1b2430}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#f3f5f7;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  #safe{height:env(safe-area-inset-top);background:var(--accent)}
  #app{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#f3f5f7}
  #splash{position:fixed;inset:0;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;transition:opacity .4s}
  #splash img{width:110px;height:110px;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #splash b{font-size:24px}
  #splash small{opacity:.85}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin-top:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #offline{position:fixed;inset:0;background:#f3f5f7;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px;z-index:30;color:var(--ink)}
  #offline .e{font-size:56px}
  #offline button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:14px 20px;background:var(--accent);color:#fff;font-size:16px}
</style>
</head>
<body>
<div id="safe"></div>
<iframe id="app" title="Happy Feet"></iframe>
<div id="splash"><img src="icon-512.png" alt=""><b>Happy Feet</b><small>Material de la clínica</small><div class="spin"></div></div>
<div id="offline"><div class="e">📴</div><h2>Sin conexión</h2>
  <p>La app necesita internet para ver y apuntar el material.</p>
  <button id="retry">Reintentar</button></div>
<script>
// URL de la app (Google Apps Script). Si se crea una implementación nueva, cambia solo esta línea.
const EXEC = 'https://script.google.com/macros/s/AKfycbyCEmzPp3jSvauLKdum59Op-R9fCN14wKR_8jdWrHSHhXv801epbB0liesIxQqR0NQR/exec';
const $ = id => document.getElementById(id);
const frame = $('app');
function quitarSplash(){ $('splash').style.opacity = 0; setTimeout(() => $('splash').style.display = 'none', 400); }
function cargar(){
  if (!navigator.onLine){ $('offline').style.display = 'flex'; quitarSplash(); return; }
  $('offline').style.display = 'none';
  frame.src = EXEC + '?t=' + Date.now();
}
frame.addEventListener('load', () => { if (frame.src) quitarSplash(); });
$('retry').onclick = cargar;
window.addEventListener('online', () => { if ($('offline').style.display === 'flex') cargar(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
cargar();
</script>
</body>
</html>
